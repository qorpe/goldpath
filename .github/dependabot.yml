# Dependency currency is automated, not remembered (asset convention, 2026-08-24).
# Pre-release channels are NOT bumped inside groups — beta packages tracking an SDK minor
# are aligned by hand in the same PR that takes the SDK bump.
# MAJORS are deliberate, never grouped (2026-08-27): the first weekly sweep tried to ride
# MassTransit 9 (license change), Roslyn 5 and vitest 4 into one bump each — a major is a
# decision with a migration story. Groups take minor/patch only; a major arrives as its
# OWN pull request (visible, individually decidable, and a closed one is not recreated —
# the mockifyr-proven pattern, which also keeps security majors visible where a blanket
# ignore would suppress them). Standing deferrals: open-threads T24. GitHub Actions majors
# stay grouped (runner-driven, CI-proven), and so does the vitest family — one release
# train, so its major arrives as ONE pull request, still a decision (see its group below).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      nuget-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui/console
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      # vitest and its @vitest/* plugins are ONE release train: the plugins import from
      # `vitest/node` at their own version, so half a bump cannot load (#359: coverage-v8
      # 5.0.5 against vitest 2 — "does not provide an export named 'BaseCoverageProvider'").
      # Every update of the family, a major included, arrives as one pull request; a major is
      # still its own PR and its own decision (T24), just no longer split in two. First, so
      # the family never falls into the catch-all below (a dependency joins its first match).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      console-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # init and analyze must run at one version ("All steps in a workflow that use
      # github/codeql-action must use the same version"); bumped one at a time, each PR
      # fails CodeQL (#469/#471). One release train, so one pull request.
      codeql-action:
        patterns: ["github/codeql-action", "github/codeql-action/*"]
