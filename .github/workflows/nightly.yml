# The heavy nightly proofs: the golden-manifest matrix + the full mutation gates.
# Public repo = free minutes; each shape/package is its own parallel job.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  # Every golden-manifest shape. The list is .github/gm-shapes.yml and the job is gm.yml,
  # which ci.yml also calls at PR time with the covering subset (open-threads T30).
  gm:
    uses: ./.github/workflows/gm.yml
    with:
      scope: all

  cli-proofs:
    # The verbs the golden-manifest lane never runs: the wizard, init, export compose,
    # discover, db status and check — against the tool built HERE, not the published one.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/console/pnpm-lock.yaml
      - name: every CLI verb, on a real generated app
        run: ./scripts/validate-cli.sh

  migrations-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: the three D7 proofs (H1 evidence, kept green forever)
        run: ./scripts/validate-migrations.sh

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The hosted-fit twenty-two: every gated package, every night. Until 2026-10-20 the six
        # long-running ones (Jobs, Archival, Bulk, Notification, Campaign, Caching) lived only in
        # mutation-heavy.yml — they OOMed the 16 GB runners (issue #20), because Stryker's
        # solution mode ran every referencing test project. Scoped to their own suites they
        # finish in under 30 min, and Caching, which kept them out (T32), clears its break.
        # mutation-heavy.yml stays as the on-demand rerun of those six.
        package: [Goldpath.Abstractions, Goldpath.Data, Goldpath.Idempotency, Goldpath.AuditTrail,
                  Goldpath.SoftDelete, Goldpath.DataProtection, Goldpath.MultiTenancy,
                  Goldpath.Locking, Goldpath.Auth, Goldpath.Cli, Goldpath.Approvals, Goldpath.FileExchange,
                  Goldpath.Console, Goldpath.Messaging, Goldpath.ServiceDefaults,
                  Goldpath.Analyzers, Goldpath.Jobs, Goldpath.Archival, Goldpath.Bulk,
                  Goldpath.Notification, Goldpath.Campaign, Goldpath.Caching]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet tool restore
      - name: mutation gate (concurrency capped — hosted runners are 4 vCPU / 16 GB)
        env:
          GOLDPATH_MUTATION_CONCURRENCY: "2"
        run: bash scripts/mutation-gate.sh "${{ matrix.package }}"
      # The evidence behind the verdict: the gate's full log and Stryker's JSON report (which
      # test killed which mutant). The console keeps only the scope lines and the score.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: mutation-${{ matrix.package }}
          path: |
            **/StrykerOutput/gate-*.log
            **/StrykerOutput/*/reports/mutation-report.json
          if-no-files-found: ignore
          retention-days: 14

  # Known CVEs in the dependency tree fail the night — the license gate's security twin.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: vulnerable packages (transitive included)
        run: |
          dotnet restore Goldpath.sln
          out=$(dotnet list Goldpath.sln package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -qi "has the following vulnerable packages"; then
            echo "::error::vulnerable packages found"; exit 1
          fi

  # The deterministic half of the eval harness: acceptance runners are portable and
  # green against committed artifacts. The LLM half (running the skills themselves)
  # stays deferred until an agent-in-CI story exists (foundation §12 / skills RFC).
  evals-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: pin the engine (published tool, not a checkout)
        run: dotnet tool install -g specdrift --version 0.4.2
      - name: runner syntax holds
        run: for f in evals/skills/*/accept.sh; do bash -n "$f"; done
      - name: breaker acceptance vs CorPay
        run: bash evals/skills/breaker/accept.sh samples/corpay

  # The console exit gate (console RFC D3): the REAL console driven against REAL Goldpath
  # apps — capability discovery, the confirm gate, a run reaching terminal, the repair
  # queue replayed, bulk's four-eyes gate and its keyset-paged report, the campaign
  # governor over a real broker, the notification evidence in all three kinds, archival's
  # chain/hold/erasure cycle, plus how the console behaves when it is REFUSED (auth floor
  # raised, tenant-scoped) and when the service dies mid-session. Dispatchable on its own.
  console-smoke:
    uses: ./.github/workflows/console-smoke.yml

  # The finance sample stays green forever: built against the PUBLISHED packages, its
  # unit contract tests and the real-AppHost smoke run nightly (samples/GAP-LEDGER.md
  # is this job's product when it goes red).
  sample-corpay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: build + unit contracts
        working-directory: samples/corpay
        run: |
          dotnet build CorPay.sln --nologo
          dotnet test tests/CorPay.Api.Tests/CorPay.Api.Tests.csproj --no-build --nologo
      - name: goldpath check (SPEC0212 — committed contract == built contract)
        working-directory: samples/corpay
        # Absent from this lane, the committed spec sat a full train behind the built
        # one — the preview.4 export-completeness fix changed four responses and nothing
        # noticed until a release review read the diff. The reference app runs the same
        # verb it tells adopters to run.
        run: |
          dotnet tool install -g Goldpath.Cli --prerelease
          dotnet tool install -g specdrift
          goldpath check
      - name: smoke (real AppHost + containers)
        working-directory: samples/corpay
        run: dotnet test tests/CorPay.SmokeTests/CorPay.SmokeTests.csproj --no-build --nologo
        timeout-minutes: 20

  # OWASP ZAP baseline (GA gate G15, owner decision Q9: the free pentest substitute, beside
  # codeql.yml). A passive scan of a GENERATED app — golden-manifest shape GmBulkOnly, its
  # API root and the console it serves — in Production posture. Any alert the committed
  # rules file does not IGNORE with a reason fails the night; the reports are uploaded
  # either way, because a red scan is read from its report.
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/console/pnpm-lock.yaml
      - name: zap baseline — the API and its served console
        run: bash scripts/zap-baseline.sh
        env:
          ZAP_OUT: ${{ runner.temp }}/zap-report
      - name: the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline
          path: ${{ runner.temp }}/zap-report
          retention-days: 30
