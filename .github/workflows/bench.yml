# Reference-profile benches (H6): the numbers in each module's ops/*-benchmarks.md are
# re-measured on PINNED CI hardware (ubuntu-latest: 4 vCPU / 16 GB) so adopters compare
# against a profile they can rent, not a dev laptop. Runs monthly (the housekeeping
# cadence — reference numbers older than a month stop being reference) and on dispatch
# whenever an engine path changes; either way, update the ops docs from the step summary
# when the numbers move.
name: bench

on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st — the monthly reference re-measure
  workflow_dispatch:
    inputs:
      provider:
        # #556 (G7 Oracle 8/12): `oracle` runs the Bulk and Jobs benches on the Oracle Free image the oracle lane pins
        # (OracleFixture.Image), the intake at 1,000,000 rows; #557 adds the Campaign benches and S-FLEET-02's
        # enumeration leg (1,000,000 targets through the pacer). The monthly schedule stays PostgreSQL-only.
        description: "Database the benches run on (postgres = the monthly reference set; oracle = Bulk, Jobs and Campaign on Oracle Free)"
        type: choice
        options: [postgres, oracle]
        default: postgres

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: benches (real containers, Category=Bench)
        if: ${{ (inputs.provider || 'postgres') == 'postgres' }}
        run: |
          # detailed console logger: without it VSTest swallows the tests' BENCH- lines
          # (the local bench-*.sh scripts run with the same flag). Category!=Oracle: the Oracle twins (#556) run only
          # when dispatched with provider=oracle, so the monthly reference set is the one it was before them.
          dotnet test tests/Goldpath.IntegrationTests/Goldpath.IntegrationTests.csproj \
            --filter "Category=Bench&Category!=Oracle" --nologo --logger "console;verbosity=detailed" 2>&1 | tee bench.log
      - name: Bulk, Jobs and Campaign benches on Oracle (dispatch only, #556, #557)
        if: ${{ inputs.provider == 'oracle' }}
        env:
          GOLDPATH_BENCH_PROVIDER: oracle
          GOLDPATH_BENCH_BULK_INTAKE_ROWS: "1000000"
        run: |
          # The scripts refuse a run that printed no `provider=oracle` line, so this step cannot pass on PostgreSQL.
          # All three run whatever the others say, and the step fails if any did: Bulk on Oracle is red until #559
          # (the file chunk column is RAW(2000)), and the Jobs and Campaign numbers must still be taken. One after
          # another, never side by side: a bench beside another bench moves both numbers.
          set +e
          scripts/bench-bulk.sh > bulk.log 2>&1; bulk=$?
          scripts/bench-jobs.sh > jobs.log 2>&1; jobs=$?
          scripts/bench-campaign.sh all > campaign.log 2>&1; campaign=$?
          cat bulk.log jobs.log campaign.log | tee bench.log
          echo "bench-bulk exit $bulk, bench-jobs exit $jobs, bench-campaign exit $campaign"
          [ "$bulk" -eq 0 ] && [ "$jobs" -eq 0 ] && [ "$campaign" -eq 0 ]
      - name: reference numbers → job summary
        if: always()
        run: |
          echo "## Reference profile (ubuntu-latest, 4 vCPU / 16 GB), provider: ${{ inputs.provider || 'postgres' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -aE "BENCH[- ]" bench.log >> "$GITHUB_STEP_SUMMARY" || echo "no BENCH lines found" >> "$GITHUB_STEP_SUMMARY"   # "BENCH " too: the Jobs bench prints `BENCH items=`
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        # Convenience upload: capped retention; a storage-quota hiccup never paints the run red.
        if: always()
        continue-on-error: true
        with:
          name: bench-log
          path: bench.log
          retention-days: 14
