# Static analysis (GA gate G15, owner decision 2026-10-21 Q9: free CodeQL + OWASP ZAP in CI
# instead of a paid pentest). Two languages: the C# of the packages, the CLI, the templates
# and the samples, and the TypeScript of the console. ZAP's dynamic baseline runs in the
# nightly (scripts/zap-baseline.sh), against a generated app.
#
# build-mode none for both: CodeQL's buildless C# extraction reads the sources without the
# solution build, so this job neither duplicates ci.yml's build nor depends on the feed.
# Every action is pinned to a commit, with its release in the comment — a tag can move, a
# commit cannot.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC — new queries reach an unchanged main too
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # upload the SARIF to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/bin/**"
              - "**/obj/**"
              - "**/node_modules/**"
              - "ui/console/dist/**"
      - name: analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
