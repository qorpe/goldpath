# The six mutation runs hosted 16 GB runners could not finish (issue #20 — exit 143 OOM at
# concurrency 2, scattered times). Dispatch-only, concurrency 1, generous timeouts; the
# release checklist keeps the LOCAL cadence as the authoritative fallback for these six.
# The OOM came from Stryker's solution mode, which ran every test project referencing the
# package (Jobs: 457 tests, the integration host among them). Since the 2026-10-20 scope fix
# each job builds and runs only its configured suites and all six finish in under 30 min.
name: mutation-heavy

on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        package: [Goldpath.Jobs, Goldpath.Archival, Goldpath.Bulk,
                  Goldpath.Notification, Goldpath.Campaign, Goldpath.Caching]
    env:
      GOLDPATH_MUTATION_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Stryker is a local tool — without the restore every job dies in seconds with
      # "Run 'dotnet tool restore'" (found on the preview.6 pre-flight dispatch).
      - run: dotnet tool restore
      - name: mutation gate (single testhost — the 16 GB survival mode)
        run: bash scripts/mutation-gate.sh "${{ matrix.package }}"
      # The evidence behind the verdict: the gate's full log and Stryker's JSON report (which
      # test killed which mutant). The console keeps only the scope lines and the score.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: mutation-${{ matrix.package }}
          path: |
            **/StrykerOutput/gate-*.log
            **/StrykerOutput/*/reports/mutation-report.json
          if-no-files-found: ignore
          retention-days: 14
