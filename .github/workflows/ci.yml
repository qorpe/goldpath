name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: pin the spec engine
        run: dotnet tool install -g specdrift --version 0.4.2
      - name: corpus gate (valid must pass, invalid must fail — manifest, specanchor, decisions)
        run: bash scripts/corpus-check.sh
      - name: specanchor freshness (the pinned artefact schemas are unedited and not behind)
        run: bash scripts/specanchor-freshness.sh
      - name: the agent layer has not drifted between its copies
        run: ./scripts/skills-parity.sh
      - name: ledger honesty (an issue a ledger references must have the state it claims)
        run: ./scripts/ledger-check.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: schema honesty (a manifest may not declare what no code can run)
        run: ./scripts/schema-honesty.sh
      - name: engine gate (GA G1 — no new bus-engine type in a public signature; the baseline only shrinks)
        run: |
          ./scripts/engine-gate.sh
          ./scripts/engine-gate.sh --selftest
      - name: docs freshness (no link to a missing file)
        run: bash scripts/docs-freshness.sh
      - name: merge tiers self-test (ADR-0014 — the rules this PR proposes still put every fixture where it belongs)
        run: python3 scripts/merge-tier.py selftest
      - name: security audit (known CVEs fail the PR — nightly already scans; PRs must too)
        run: |
          dotnet restore -v q
          dotnet list package --vulnerable --include-transitive > vulnerable.txt
          cat vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - name: template pins are on THIS train (a stale pin silently generates an old one)
        run: bash scripts/template-pins.sh
      # The two product-repo antidotes (platform RFC §2b, R-1/R-2), rehearsed here against
      # CorPay because CorPay is the adopter-shaped product: it binds to the published train
      # exactly as qorpe/api-portal will. A gate that has never run somewhere real is a
      # promise, not a control.
      - name: train freshness (a product may not silently fall trains behind)
        run: bash scripts/train-freshness.sh samples/corpay
      - name: product guard (no compile-linked core source — the invisible fork)
        run: bash scripts/product-guard.sh samples/corpay
      - name: build
        run: dotnet build Goldpath.sln --nologo
      - name: unit tests
        run: |
          set -e
          for p in tests/*/; do
            n=$(basename "$p")
            if [ "$n" != "Goldpath.IntegrationTests" ] && [ "$n" != "Goldpath.Jobs.TestHost" ] && [ -f "$p/$n.csproj" ]; then
              dotnet test "$p/$n.csproj" --no-build --nologo
            fi
          done
      - name: format
        run: dotnet format Goldpath.sln --verify-no-changes
      - name: license gate (free/OSS only)
        run: python3 scripts/license-gate.py

  # Public repo: Actions minutes are free and ubuntu-latest ships Docker — the heavy
  # proofs run HERE now (the GitLab-era "register a runner" item died with the move).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: integration proofs (real containers, benches excluded)
        run: |
          dotnet test tests/Goldpath.IntegrationTests/Goldpath.IntegrationTests.csproj \
            --filter "Category!=Bench" --nologo
          # The bus conformance suite (ADR-0013 §3): the facts a bus must hold for Goldpath,
          # on real RabbitMQ + PostgreSQL through the seam — the oracle is MassTransit 8.5.11.
          dotnet test tests/Goldpath.Messaging.Conformance/Goldpath.Messaging.Conformance.csproj --nologo
        timeout-minutes: 45

  # The console (U2+): component tests over the PUBLISHED @qorpe/ui kit — the kit's
  # own tests live in its repo (github.com/qorpe/ui); here we prove the CONSUMER.
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/console/pnpm-lock.yaml
      - name: kit freshness gate (@qorpe/ui may not fall behind)
        run: ./scripts/kit-freshness.sh
      - name: console tests (the run console over the frozen contract)
        working-directory: ui/console
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

  # The golden-manifest matrix at PR time (ADR-0008, open-threads T30). The nightly runs
  # every shape; a pull request runs the covering subset (`pr: true` in gm-shapes.yml —
  # golden-manifests-v1.md §6 says why each one) when it touches what a generated app is
  # built from. The lane packs THIS checkout into a local feed that shadows nuget.org, so
  # that is more than the templates: the packages, the analyzers, the CLI that writes into
  # the app, the console bundle that ships inside Goldpath.Console, the manifest schema
  # spec-lint validates against, the root build files every pack reads, and the lane itself.
  # The filter lives in a job, not in `on.pull_request.paths`, so the check below always
  # reports — a path-filtered workflow that does not run leaves a required check pending.
  gm-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - id: diff
        name: does this PR touch what a generated app is built from?
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > files.txt
          pattern='^(templates/|tools/Goldpath\.Cli/|analyzers/|packages/|ui/console/|schemas/manifest/|Directory\.(Build|Packages)\.props$|global\.json$|nuget\.config$|scripts/(validate-gm|build-console)\.sh$|\.github/gm-shapes\.yml$|\.github/workflows/(gm|ci)\.yml$)'
          if grep -E "$pattern" files.txt > hits.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "── the golden-manifest PR subset runs: $(wc -l < hits.txt) of $(wc -l < files.txt) changed files are on its path"
            head -20 hits.txt
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "── none of the $(wc -l < files.txt) changed files can change a generated app; the nightly still runs every shape"
          fi

  gm:
    needs: gm-scope
    if: needs.gm-scope.outputs.run == 'true'
    # A new push to the same PR supersedes the shapes still running for the old head.
    concurrency:
      group: gm-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/gm.yml
    with:
      scope: pr

  # The stable, required-able check: green when the subset passed OR when the PR touches
  # nothing it covers; red when any shape failed, was cancelled, or the scope job failed.
  gm-gate:
    name: golden manifests (PR subset)
    if: always()
    needs: [gm-scope, gm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.gm-scope.result }}
          RUN: ${{ needs.gm-scope.outputs.run }}
          GM: ${{ needs.gm.result }}
        run: |
          echo "gm-scope: $SCOPE (run=$RUN) · gm: $GM"
          case "$SCOPE" in success|skipped) ;; *) echo "::error::the scope job did not succeed ($SCOPE)"; exit 1 ;; esac
          if [ "$RUN" = "true" ] && [ "$GM" != "success" ]; then
            echo "::error::a golden-manifest shape is not green ($GM) — see the gm / <shape> jobs"; exit 1
          fi
          echo "golden manifests: OK"
